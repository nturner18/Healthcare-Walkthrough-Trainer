<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walkthrough Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f4f7;--panel:#ffffff;--ink:#121c36;--muted:#5a6479;--line:#dbe0e8;
  --navy:#011138;--gold:#D4A04C;--high:#b8392b;--med:#a96f0c;--low:#2f7565;--ok:#3f679f;--good:#2f7d4f;
  --stagebg:#dfe5ea;--chip:#eef1f6;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#060b20;--panel:#0e1633;--ink:#e9edf6;--muted:#9ba6bf;--line:#243052;
    --high:#e0705f;--med:#e2a843;--low:#5fbfa6;--ok:#86a8de;--good:#6fcf97;--stagebg:#0a1230;--chip:#18234a;
  }
}
:root[data-theme="dark"]{
  --bg:#060b20;--panel:#0e1633;--ink:#e9edf6;--muted:#9ba6bf;--line:#243052;
  --high:#e0705f;--med:#e2a843;--low:#5fbfa6;--ok:#86a8de;--good:#6fcf97;--stagebg:#0a1230;--chip:#18234a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5;min-height:100%}
button{font:inherit;color:inherit}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,[tabindex]:focus-visible,summary:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand svg{flex:none}
.brand b{font-weight:700;font-size:15px;white-space:nowrap}
.brand span{font-size:13px;color:#c9d0e4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(212,160,76,.6);border-radius:999px;padding:5px 12px 5px 8px;cursor:pointer;font-variant-numeric:tabular-nums;font-weight:600}
.timer.low{border-color:#ff8a72;color:#ffd2c8}
.sbtn{background:rgba(255,255,255,.08);border:1px solid rgba(212,160,76,.6);border-radius:999px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.sw{display:flex;width:100%;gap:14px;align-items:center;text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px;cursor:pointer}
.sw[aria-checked="true"]{border-color:var(--gold);background:rgba(212,160,76,.10)}
.sw .swt{flex:1}.sw .swt b{display:block;font-size:16px}.sw .swt span{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.track{flex:none;width:52px;height:30px;border-radius:999px;background:#c3c9d3;position:relative;transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.sw[aria-checked="true"] .track{background:#011138}.sw[aria-checked="true"] .track::after{left:25px}
.sw .state{flex:none;width:28px;font-size:13px;font-weight:700;color:var(--muted)}
.scns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.scns{grid-template-columns:1fr}}
.scn{display:block;text-align:left;background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer}
.scn b{display:block;font-size:16px}.scn span{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.scn[aria-pressed="true"]{border-color:var(--gold);background:rgba(212,160,76,.12);box-shadow:inset 0 0 0 1px var(--gold)}
.score{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:15px}
.score small{color:#c9d0e4;font-weight:500}

main{display:grid;grid-template-columns:1fr}
@media (min-width:900px){
  main{grid-template-columns:minmax(0,1fr) 420px;height:calc(100vh - 58px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
  .panel{overflow-y:auto;border-left:1px solid var(--line)}
}
.stagewrap{position:relative;background:var(--stagebg);height:clamp(300px,72vw,60vh);overflow:hidden}
@media (min-width:900px){.stagewrap{height:100%}}
#stage{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;transition:opacity .16s ease}
#stage text{font-family:'Public Sans',system-ui,sans-serif}
#stage .hand{font-family:'Caveat','Segoe Print','Bradley Hand',cursive}
#stage [data-id],#stage [data-go],#stage [data-room]{cursor:pointer}
#stage [data-room]:hover rect.roomfill{fill:#fff7e8}
#stage [data-id]:focus,#stage [data-go]:focus,#stage [data-room]:focus{outline:none}
#stage [data-id]:focus-visible>*:first-child,#stage [data-room]:focus-visible rect{stroke:var(--gold);stroke-width:5}
#markers{pointer-events:none}
.ripple{animation:rip .5s ease-out forwards}
@keyframes rip{from{opacity:.7;r:4}to{opacity:0;r:34}}
.pulse{animation:pul 1.1s ease-in-out infinite}
@keyframes pul{0%,100%{opacity:1}50%{opacity:.25}}
.pop{animation:pop .7s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes pop{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(1.6)}}
@media (prefers-reduced-motion: reduce){.ripple,.pulse,.pop{animation:none}#stage{transition:none}}

.ctl{position:absolute;display:flex;gap:8px}
.ctl.zoom{right:12px;bottom:12px;flex-direction:column}
.ctl.back{left:12px;top:12px}
.ctl button{background:var(--navy);color:#fff;border:1.5px solid var(--gold);border-radius:12px;min-width:44px;height:44px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;cursor:pointer;font-weight:600;font-size:14px;box-shadow:0 2px 10px rgba(1,17,56,.25)}
.ctl.zoom button{width:44px;padding:0}
.hidden{display:none !important}

.panel{background:var(--panel);padding:18px 18px 28px}
.roomhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.roomhead h2{margin:0;font-size:22px;letter-spacing:-.01em}
.roomhead .rc{color:var(--muted);font-size:14px;white-space:nowrap}
.progress{height:6px;background:var(--chip);border-radius:6px;overflow:hidden;margin:8px 0 14px}
.progress i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.actions button,.btnrow button,.seg button,.trap{background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px;font-weight:600}
.actions button.primary,.btnrow button.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .actions button.primary,:root[data-theme="dark"] .btnrow button.primary{border-color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .actions button.primary,:root:not([data-theme="light"]) .btnrow button.primary{border-color:var(--gold)}}

.card{border-top:1px solid var(--line);padding-top:14px}
.card h3{margin:6px 0 10px;font-size:19px;line-height:1.3}
.card p{margin:0 0 10px}
.muted{color:var(--muted)}
.q{font-weight:600;font-size:17px;margin:0 0 12px}
.seg{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}
.seg>span{width:100%;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--gold);background:rgba(212,160,76,.18)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 6px}
.chip{display:inline-block;font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;border:1.5px solid currentColor;margin-right:6px}
.sev-High{color:var(--high)}.sev-Medium{color:var(--med)}.sev-Low{color:var(--low)}.c-ok{color:var(--ok)}.c-give{color:var(--good)}.c-save{color:var(--ok)}
.banner{border-radius:12px;padding:10px 14px;margin:0 0 14px;font-weight:600;background:var(--chip);border-left:4px solid var(--gold)}
.banner small{display:block;font-weight:500;color:var(--muted);margin-top:2px;font-size:14px}
.banner.bad{border-left-color:var(--high)}.banner.good{border-left-color:var(--good)}.banner.mid{border-left-color:var(--med)}
.fld{margin:0 0 12px}
.fld h4{margin:0 0 2px;font-size:13px;font-weight:700;color:var(--muted)}
.fld p{margin:0}
details.say{background:var(--chip);border-radius:12px;padding:10px 14px;margin:6px 0 12px}
details.say summary{cursor:pointer;font-weight:600;font-size:14.5px}
details.say p{margin:8px 0 0;font-size:15.5px}
.owner{font-style:italic}
.trap{border-style:dashed;margin:4px 0 10px;text-align:left}
.conduct{border-left:4px solid var(--high);background:var(--chip);border-radius:10px;padding:10px 14px;margin:6px 0 12px}
.tip{font-size:14.5px;color:var(--muted);margin:0 0 8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(1,10,35,.62);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--panel);color:var(--ink);width:100%;max-width:680px;max-height:100%;overflow-y:auto;border-radius:18px;padding:22px 20px;border-top:4px solid var(--gold)}
.sheet h2{margin:0 0 6px;font-size:24px;letter-spacing:-.01em}
.sheet h3.sec{margin:26px 0 8px;font-size:18px;padding-top:16px;border-top:1px solid var(--line)}
.sheet p{margin:0 0 12px}
.sheet .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.sheet .btns button{border-radius:12px;padding:11px 16px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:transparent}
.sheet .btns button.primary{background:var(--navy);color:#fff;border-color:var(--gold)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.opt input{width:20px;height:20px;margin-top:2px;accent-color:#011138;flex:none}
.opt b{display:block}
.opt span{color:var(--muted);font-size:14.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 8px}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,1fr)}}
.stats div{background:var(--chip);border-radius:12px;padding:10px 12px}
.stats b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stats span{font-size:13px;color:var(--muted)}
.insight{background:var(--chip);border-radius:12px;padding:12px 14px;margin:8px 0}
.insight ul{margin:6px 0 6px 18px;padding:0}
.dr{margin:18px 0 6px;font-size:16px}
.di{border-top:1px solid var(--line)}
.di summary{list-style:none;display:flex;align-items:center;gap:10px;padding:10px 0;cursor:pointer;flex-wrap:wrap}
.di summary::-webkit-details-marker{display:none}
.di summary .t{flex:1;min-width:160px}
.di .body{padding:0 0 12px 22px}
.di .body p{margin:0 0 8px}
.st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--chip);white-space:nowrap}
.st.found{background:var(--gold);color:#011138}.st.hint{border:1.5px solid var(--gold)}.st.revealed,.st.after{border:1.5px dashed var(--muted)}.st.changed{border:1.5px solid var(--gold)}.st.dismissed,.st.missed{border:1.5px solid var(--high);color:var(--high)}
.pick{display:flex;gap:10px;align-items:center;padding:6px 0}
.pick input{width:18px;height:18px;accent-color:#011138}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
@media (max-width:520px){.cmp{grid-template-columns:1fr}}
.cmp div{background:var(--chip);border-radius:12px;padding:10px 12px}
.cmp ol{margin:6px 0 0 18px;padding:0}
textarea{width:100%;min-height:90px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 12px;font:inherit;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;border:1.5px solid var(--gold);padding:9px 16px;border-radius:12px;font-weight:600;font-size:14.5px;z-index:60;max-width:92vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:899px){.stagewrap{height:calc(60vw + 64px)}.ctl.zoom{flex-direction:row;bottom:10px;right:10px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="26" height="30" viewBox="0 0 26 30" aria-hidden="true"><path d="M13 1 L24 5 V14 C24 21 19 26 13 29 C7 26 2 21 2 14 V5 Z" fill="none" stroke="#D4A04C" stroke-width="2.4"/><path d="M8 15 l4 4 l7 -8" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div style="min-width:0;display:flex;flex-direction:column;line-height:1.2"><b>Walkthrough trainer</b><span id="brandSub">Brightline Family Dental</span></div>
  </div>
  <button class="sbtn" id="soundBtn" aria-label="Turn office sounds off" aria-pressed="true"><svg id="soundIcon" width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"></svg></button>
  <button class="timer" id="timerBtn" aria-label="Start or pause timer">
    <svg id="timerIcon" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"></svg>
    <span id="timerTxt">30:00</span>
  </button>
  <div class="score" id="score"></div>
</header>

<main>
  <div class="stagewrap" id="wrap">
    <svg id="stage" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet" aria-label="Office view">
      <defs><filter id="ds" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1b2430" flood-opacity=".22"/></filter></defs>
      <g id="scene"></g>
      <g id="markers"></g>
    </svg>
    <div class="ctl back hidden" id="backCtl">
      <button id="planBtn" aria-label="Zoom out to floor plan">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><rect x="2" y="2" width="14" height="14" fill="none" stroke="#D4A04C" stroke-width="2"/><path d="M2 8 H10 V2 M10 11 V16" stroke="#D4A04C" stroke-width="2" fill="none"/></svg>
        Floor plan
      </button>
    </div>
    <div class="ctl zoom">
      <button id="zin" aria-label="Zoom in"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M9 3v12M3 9h12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <button id="zout" aria-label="Zoom out"><svg width="18" height="18" viewBox="0 0 18 18"><path d="M3 9h12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <button id="zfit" aria-label="Show whole room"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#D4A04C" stroke-width="2"><path d="M2 6V2h4M12 2h4v4M16 12v4h-4M6 16H2v-4"/></svg></button>
    </div>
  </div>

  <aside class="panel" id="panel">
    <div class="roomhead"><h2 id="roomTitle">Floor plan</h2><span class="rc" id="roomCount"></span></div>
    <div class="progress" id="progWrap"><i id="roomBar"></i></div>
    <div class="actions">
      <button id="hintBtn">Hint</button>
      <button id="revealBtn">Show what I missed</button>
      <button id="debriefBtn" class="primary">Debrief</button>
    </div>
    <div id="card"></div>
  </aside>
</main>

<div class="overlay hidden" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= CONTENT ================= */
const D_ROOM_NAMES = {plan:"Floor plan", reception:"Reception", hallway:"Hallway", operatory:"Operatory 1", imaging:"Imaging room", backoffice:"Back office"};
const D_ROOM_ORDER = ["reception","hallway","operatory","imaging","backoffice"];

/* Nick's objection handlers */
const HANDLERS = {
 it:{q:"We already have an IT guy.",a:"That's great, and I'm not looking to replace him. He keeps things running. My job is to independently check the security and compliance side. You wouldn't have your accountant audit his own books, and the same idea applies here. Happy to work alongside him."},
 vendor:{q:"Our vendor handles security.",a:"They do a great job on the platform side. But they don't control what happens on your end: who has access, whether staff share logins, whether old employee accounts were turned off, whether your Wi-Fi is separated from guest access. Those are on the practice, and those are the gaps that show up in an audit."},
 covered:{q:"We already have it covered.",a:"Glad to hear it. Is it documented, and when was it last reviewed? Things drift: new staff, new devices, vendor access. The walkthrough would either confirm you're in good shape or catch what's changed."},
 small:{q:"We're too small to be a target.",a:"That's what attackers count on. Most attacks are automated. They scan for open doors, not company size, and small businesses usually have the most of them."},
 costly:{q:"Costly how?",a:"A few ways. If ransomware locks your systems, you can't see patients or take payments until it's fixed. If someone gets into your email, they can redirect a payment and that money's usually gone. And if data gets exposed, you're looking at notification costs, possible fines, and lawsuits."}
};
const SAVE_LINE = "That's one I'd want to look at properly before I tell you what to do.";

/*
 cat: give = obvious fix, doable today, no knowledge of their systems
      save = fix depends on their systems, vendors or payment process
 cost: 1 cheap/today, 2 moderate, 3 project
 sb: pw (password policy) | train (staff training) for SB 2610 under-20 tier
*/
const D_FINDINGS = [
 /* ---------- RECEPTION ---------- */
 {id:"r-screen",room:"reception",sev:"High",cat:"give",cost:1,label:"Front desk monitor",
  title:"Schedule monitor faces the waiting room",
  see:"The front desk monitor is angled toward the chairs. From the waiting side you can read today's schedule: patient names and procedures.",
  why:"Anyone waiting can see who is coming in and why. It's an avoidable disclosure and one of the first things a patient or auditor notices.",
  ref:"HIPAA 45 CFR 164.530(c) safeguards; 164.310(c) workstation security",
  say:"Your schedule screen is readable from the waiting room, so anyone sitting there can see who's coming in and why. Turning it toward the desk or adding a privacy filter fixes that today.",
  fix:"Reposition the monitor so only staff can see it, add a privacy filter, and set a short screen lock. Put screen placement into the workstation security policy so it survives the next furniture shuffle.",
  ask:"Has a patient ever mentioned seeing other names up here?",
  push:{owner:"We've never had anyone complain about it.",h:"covered"},
  ok:"The monitor faces the desk and has a privacy filter. Nothing to raise."},
 {id:"r-sticky",room:"reception",sev:"High",cat:"give",cost:1,pattern:true,sb:"pw",label:"Note on the monitor",
  title:"Password on a sticky note",
  see:"A small sticky note on the bottom of the monitor bezel reads pw: {DESKPW}",
  why:"A written password at a public counter undoes every other control on that workstation, and its word-plus-year style is probably used elsewhere too.",
  ref:"HIPAA 164.308(a)(5)(ii)(D) password management; NIST CSF 2.0 PR.AA",
  say:"There's a password on a sticky note at the front desk. I'd take it down and change that password today.",
  fix:"Remove the note, change the password, and give front desk staff individual logins plus a password manager. Cover written-down passwords in the password policy and in staff training.",
  ask:"Is that password shared by everyone who works the desk?",
  push:{owner:"Who's going to use it? We're a small office.",h:"small"},
  ok:"No notes on the monitor. Nothing to raise."},
 {id:"r-card",room:"reception",sev:"High",cat:"save",cost:2,label:"Notepad by the terminal",
  title:"Card numbers written on a notepad",
  see:"Among the papers by the card terminal is a notepad with a full card number, expiration date, and the three-digit security code.",
  why:"Keeping the security code after authorization is prohibited outright, on paper or not. If that notepad walks away, the practice owns the fraud and the notification.",
  ref:"PCI DSS v4.0.1 Req. 3.3.1 (no sensitive authentication data after authorization); Req. 9.4 media protection",
  contain:"Shred that notepad today.",
  say:"I see card details written down by the terminal, including the security code. I'd shred that sheet today. How you take phone payments going forward depends on your payment setup, so that's one I'd want to look at properly before I tell you what to do.",
  fix:"Stop writing card data down. Move phone payments to a virtual terminal, text-to-pay, or a processor payment link so card data never touches paper or practice systems, then confirm PCI scope and the SAQ type with the processor.",
  ask:"How do you take payments over the phone today?",
  push:{owner:"Costly how? It's just a notepad.",h:"costly"},
  ok:"Just a blank notepad and appointment cards. Nothing to raise."},
 {id:"r-signin",room:"reception",sev:"Medium",cat:"give",cost:1,label:"Clipboard on the counter",
  title:"Sign-in sheet asks for reason for visit",

function navBadge(x,y,label,go,dir){
  const chev = dir==="left" ? `<path d="M${x-52} ${y-7} l-8 7 l8 7" fill="none" stroke="#D4A04C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`
                            : `<path d="M${x+52} ${y-7} l8 7 l-8 7" fill="none" stroke="#D4A04C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
  return `<g data-go="${go}" tabindex="0" role="button" aria-label="Walk to ${label}" filter="url(#ds)"><rect x="${x-76}" y="${y-23}" width="152" height="46" rx="23" fill="#011138" stroke="#D4A04C" stroke-width="2"/><text x="${x+(dir==='left'?6:-6)}" y="${y+6}" text-anchor="middle" font-size="17" font-weight="600" fill="#fff">${label}</text>${chev}</g>`;
}
function obj(id,inner){
  const d = FIND[id]||DECOYS[id];
  return `<g data-id="${id}" tabindex="0" role="button" aria-label="${d?d.label:'Item'}">${inner}</g>`;
}
const shadow=(cx,cy,rx,ry=8,o=.16)=>`<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#1b2430" opacity="${o}"/>`;

/* shared room shell: lit wall, ceiling, baseboard, perspective floor */
function shell(o){
  const VP={x:600,y:150};
  let lines='';
  for(let xb=-1400; xb<=2600; xb+=o.tile||110){const xt=VP.x+(xb-VP.x)*(480-VP.y)/(720-VP.y);lines+=`<path d="M${xt.toFixed(1)} 480L${xb} 720" stroke="${o.floorLine}" stroke-width="1.2" opacity=".55"/>`;}
  if(o.rows!==false){for(let i=1;i<7;i++){const y=480+240*Math.pow(i/7,1.5);lines+=`<path d="M-1400 ${y.toFixed(1)}H2600" stroke="${o.floorLine}" stroke-width="1.2" opacity=".5"/>`;}}
  const lights=(o.lights||[300,900]).map(x=>`<ellipse cx="${x}" cy="40" rx="260" ry="230" fill="url(#lp)"/><rect x="${x-60}" y="14" width="120" height="8" rx="2" fill="#fbfaf2" stroke="#d6d3c4"/>`).join('');
  return `<defs>
    <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${o.wallTop}"/><stop offset="1" stop-color="${o.wallBot}"/></linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${o.floorFar}"/><stop offset="1" stop-color="${o.floorNear}"/></linearGradient>
    <radialGradient id="lp"><stop offset="0" stop-color="#fffdf2" stop-opacity=".55"/><stop offset="1" stop-color="#fffdf2" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".35"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect x="-1400" y="0" width="4000" height="480" fill="url(#wg)"/>
  ${lights}
  <rect x="-1400" y="0" width="4000" height="14" fill="${o.ceiling}"/>
  <rect x="-1400" y="14" width="4000" height="3" fill="#000" opacity=".06"/>
  <rect x="-1400" y="480" width="4000" height="240" fill="url(#fg)"/>
  ${lines}
  <rect x="-1400" y="466" width="4000" height="16" fill="${o.base}"/>
  <rect x="-1400" y="480" width="4000" height="10" fill="#000" opacity=".07"/>`;
}

function door(x,y,w,h,col,frame){
  return `<rect x="${x-8}" y="${y-8}" width="${w+16}" height="${h+8}" fill="${frame}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${col}"/>
  <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#glass)" opacity=".5"/>
  <rect x="${x+16}" y="${y+24}" width="${w-32}" height="${h*.3}" fill="none" stroke="#000" stroke-opacity=".08" stroke-width="3"/>
  <rect x="${x+16}" y="${y+h*.45}" width="${w-32}" height="${h*.45}" fill="none" stroke="#000" stroke-opacity=".08" stroke-width="3"/>
  <rect x="${x+w-26}" y="${y+h/2}" width="16" height="6" rx="3" fill="#7a6a52"/>`;
}
function plaque(x,y,w,txt,fill){
  return `<rect x="${x}" y="${y}" width="${w}" height="24" rx="3" fill="${fill}"/><text x="${x+w/2}" y="${y+16.5}" text-anchor="middle" font-size="12" font-weight="600" fill="#fff">${txt}</text>`;
}
function paper(x,y,w,h,rot,inner='',fill='#fdfdfb'){
  return `<g transform="rotate(${rot} ${x+w/2} ${y+h/2})"><rect x="${x+1.5}" y="${y+2}" width="${w}" height="${h}" fill="#000" opacity=".12"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="#d8d8d2" stroke-width=".8"/>${inner}</g>`;
}
function lines(x,y,w,n,gap=4,c='#cfd2d6'){let s='';for(let i=0;i<n;i++)s+=`<rect x="${x}" y="${y+i*gap}" width="${w*(i%3==2?.6:1)}" height="1.6" fill="${c}"/>`;return s}

/* ================= ENGINE ================= */
const KEY='aegis-walkthrough-v2';
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SEVR={High:3,Medium:2,Low:1};
const CATN={give:"Give it",save:"Save it"};
let FINDINGS,FIND,DECOYS,ROOM_NAMES,ROOM_ORDER,SCENES,PLAN_RECT,BG,CONDUCT,SC;
function setScenario(k){SC=SCEN[k]||SCEN.dental;FINDINGS=SC.findings;FIND=Object.fromEntries(FINDINGS.map(f=>[f.id,f]));DECOYS=SC.decoys;ROOM_NAMES=SC.rooms;ROOM_ORDER=SC.order;SCENES=SC.scenes;PLAN_RECT=SC.planRect;BG=SC.bg;CONDUCT=SC.conduct;
  document.title=`Walkthrough Trainer: ${SC.name}`;const bs=document.getElementById('brandSub');if(bs)bs.textContent=SC.name;}

function pickActive(){
  const n=12+rnd(4);
  const pat=shuffle(FINDINGS.filter(f=>f.pattern).map(f=>f.id)).slice(0,2+rnd(3));
  let act=[...pat];
  const rest=shuffle(FINDINGS.map(f=>f.id).filter(id=>!act.includes(id)));
  ROOM_ORDER.forEach(room=>{if(!act.some(id=>FIND[id].room===room)){const c=rest.find(id=>FIND[id].room===room&&!act.includes(id));if(c)act.push(c)}});
  for(const id of rest){if(act.length>=n)break;if(!act.includes(id))act.push(id)}
  FINDINGS.forEach(f=>{if(f.pair&&act.some(id=>FIND[id].pair===f.pair)&&!act.includes(f.id))act.push(f.id)});
  for(let i=act.length-1;act.length>15&&i>=0;i--){const f=FIND[act[i]];if(!f.pattern&&!f.pair&&act.filter(id=>FIND[id].room===f.room).length>1)act.splice(i,1)}
  return act;
}
function newRun(k){
  setScenario(k||(SC&&SC.key)||'dental');
  const d=new Date(), year=d.getFullYear();
  const fn=shuffle(FIRST), ln=shuffle(LAST);
  const P=[null];for(let i=0;i<6;i++)P.push({f:fn[i],l:ln[i],dob:`${pad(1+rnd(12))}/${pad(1+rnd(28))}/${pad(50+rnd(50))}`});
  const it=pick(IT_NAMES);
  const g=()=>String(rnd(10000)).padStart(4,'0');
  const base={scenario:SC.key,active:pickActive(),P,year,it,
    day:d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).replace(',',''),
    md:`${d.getMonth()+1}/${d.getDate()}`,month:d.toLocaleDateString('en-US',{month:'long'}),dom:d.getDate(),
    card:`4532 ${g()} ${g()} ${g()}`,exp:`${pad(1+rnd(12))}/${pad((year%100)+1+rnd(4))}`,cvv:String(100+rnd(900))};
  return Object.assign(base,SC.extra(base,year));
}
function freshState(k){return{v:2,run:newRun(k),timed:true,realistic:true,started:false,remaining:1800,ended:false,j:{},hinted:[],revealed:[],hints:0,auth:null,traps:[],lead:[],leadDone:false,notes:"",sound:true,trapLog:[]}}
let S=freshState();
const R=()=>S.run;
const A=id=>S.run.active.includes(id);
function fill(s){if(!s)return s;const r=R();return s.replace(/\{P(\d)\}/g,(m,i)=>`${r.P[i].f} ${r.P[i].l}`).replace(/\{([A-Z]+)\}/g,(m,k)=>SC.tokens[k]!==undefined&&r[SC.tokens[k]]!==undefined?r[SC.tokens[k]]:m)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.v===2&&s.run&&Array.isArray(s.run.active)){setScenario(s.run.scenario||'dental');if(s.run.active.every(id=>FIND[id])){S=Object.assign(freshState(s.run.scenario||'dental'),s);setScenario(S.run.scenario);return true}}}catch(e){}return false}

/* status of an active finding */
function statusOf(id){const j=S.j[id];if(!j)return 'missed';return j.raise?j.status:'dismissed'}
const STATUS_TXT={found:"Found",hint:"With a hint",revealed:"Revealed",after:"After time",changed:"Second look",dismissed:"Passed on",missed:"Missed"};
const foundF=()=>activeF().filter(f=>statusOf(f.id)==='found');
function trapFor(id){const c=CONDUCT[id];if(!c)return null;if(c.off)return A(id)?FIND[id].conduct:c.off;return c}
const activeF=()=>FINDINGS.filter(f=>A(f.id));
const raisedF=()=>activeF().filter(f=>S.j[f.id]&&S.j[f.id].raise);

/* ---------- camera ---------- */
const svg=document.getElementById('stage'), sceneG=document.getElementById('scene'), markersG=document.getElementById('markers'), wrap=document.getElementById('wrap');
let cam={x:0,y:0,w:W,h:H};
function aspect(){const r=wrap.getBoundingClientRect();return (r.height||1)/(r.width||1)}
function fitW(){return Math.max(W,H/aspect())}
function clampCam(c){const Asp=aspect();const fw=fitW();let w=Math.min(fw,Math.max(fw/7,c.w));let h=w*Asp;let x=w>=W?(W-w)/2:Math.min(W-w,Math.max(0,c.x));let y=h>=H?(window.innerWidth<900?0:(H-h)/2):Math.min(H-h,Math.max(0,c.y));return{x,y,w,h}}
function applyCam(){svg.setAttribute('viewBox',`${cam.x} ${cam.y} ${cam.w} ${cam.h}`)}
function setCam(c){cam=clampCam(c);applyCam()}
function camFor(){const w=fitW();return clampCam({x:(W-w)/2,y:(H-w*aspect())/2,w})}
function fitRect(r,pad=24){const Asp=aspect();let [x,y,w,h]=r;x-=pad;y-=pad;w+=pad*2;h+=pad*2;const cw=Math.max(w,h/Asp);const ch=cw*Asp;return clampCam({x:x+w/2-cw/2,y:y+h/2-ch/2,w:cw})}
function toSvg(cx,cy){const r=svg.getBoundingClientRect();const k=Math.max(cam.w/r.width,cam.h/r.height);const ox=r.left+(r.width-cam.w/k)/2,oy=r.top+(r.height-cam.h/k)/2;return{x:cam.x+(cx-ox)*k,y:cam.y+(cy-oy)*k,k}}
function zoomAt(cx,cy,f){const p=toSvg(cx,cy);const fw=fitW();const nw=Math.min(fw,Math.max(fw/7,cam.w*f));const ff=nw/cam.w;setCam({x:p.x-(p.x-cam.x)*ff,y:p.y-(p.y-cam.y)*ff,w:nw})}
const reduceMotion=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
function animateCam(to,ms=440){return new Promise(res=>{if(reduceMotion()){cam=to;applyCam();return res()}const from={...cam},t0=performance.now();function step(t){const p=Math.min(1,(t-t0)/ms);const e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;cam={x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e,w:from.w+(to.w-from.w)*e,h:from.h+(to.h-from.h)*e};applyCam();p<1?requestAnimationFrame(step):res()}requestAnimationFrame(step)})}
function fade(v){return new Promise(res=>{svg.style.opacity=v;setTimeout(res,reduceMotion()?0:170)})}

/* ---------- rendering ---------- */
let current='plan', busy=false;
function renderScene(key){current=key;const [wc,fc,sy]=BG[key];
  const ext=key==='plan'?`<rect x="-3000" y="-3000" width="7200" height="6720" fill="${wc}"/>`:`<rect x="-3000" y="-3000" width="7200" height="${3000+sy}" fill="${wc}"/><rect x="-3000" y="${sy}" width="7200" height="3000" fill="${fc}"/>`;
  sceneG.innerHTML=ext+SCENES[key]();Sound.setRoom(key);
  document.getElementById('backCtl').classList.toggle('hidden',key==='plan');
  renderMarkers();updatePanel();}
async function goRoom(key){
  if(busy||key===current)return; busy=true;
  if(current==='plan'&&PLAN_RECT[key]){await animateCam(fitRect(PLAN_RECT[key]),460);await fade(0);renderScene(key);cam=camFor();applyCam();await fade(1);}
  else{await fade(0);renderScene(key);cam=camFor();applyCam();await fade(1);}

function drawSound(){const onx=S.sound;document.getElementById('soundIcon').innerHTML=`<path d="M3 7.5h3l4-3.5v12l-4-3.5H3z" fill="#D4A04C"/>`+(onx?`<path d="M13 7a4 4 0 0 1 0 6M15.2 4.8a7 7 0 0 1 0 10.4" fill="none" stroke="#D4A04C" stroke-width="1.8" stroke-linecap="round"/>`:`<path d="M13 7.5l5 5M18 7.5l-5 5" stroke="#D4A04C" stroke-width="1.8" stroke-linecap="round"/>`);soundBtn.setAttribute('aria-pressed',onx);soundBtn.setAttribute('aria-label',onx?'Turn office sounds off':'Turn office sounds on')}
soundBtn.onclick=()=>{S.sound=!S.sound;save();drawSound();if(S.sound&&S.started)Sound.start();else Sound.stop();toast(S.sound?'Office sounds on':'Office sounds off')};
document.addEventListener('visibilitychange',()=>{if(document.hidden)Sound.stop();else if(S.sound&&S.started)Sound.start()});
document.addEventListener('pointerdown',()=>{if(S.sound&&S.started&&!Sound.on)Sound.start()},{capture:true});
function recommended(){
  const all=activeF().slice().sort((a,b)=>(SEVR[b.sev]*10-b.cost)-(SEVR[a.sev]*10-a.cost)||(a.cat==='give'?-1:1));
  const hook=all.find(f=>f.hook);
  if(hook)return [...all.filter(f=>!f.hook).slice(0,2),hook];
  return all.slice(0,3);
}

function openDebrief(heading){
  const act=activeF(), st={found:0,hint:0,revealed:0,after:0,changed:0,dismissed:0,missed:0};
  act.forEach(f=>st[statusOf(f.id)]++);
  const fps=Object.keys(S.j).filter(id=>S.j[id].status==='fp');
  const raised=raisedF();
  const fnd=foundF(), sevM=fnd.filter(f=>S.j[f.id].sev===f.sev).length, catM=fnd.filter(f=>S.j[f.id].cat===f.cat).length;
  const used=S.timed?Math.min(1800,1800-S.remaining):null;

  /* connect the dots */
  let pattern='';
  SC.dots(R()).forEach(d=>{
    const a=d.ids.filter(id=>A(id));if(a.length<d.min)return;
    const got=a.filter(id=>S.j[id]&&S.j[id].raise), yes=got.length>=d.min;
    pattern+=`<h3 class="sec">${esc(yes?d.yes:d.no)}</h3><div class="insight"><p>${esc(yes?d.yesTxt:d.noTxt)}</p>${listHTML(d.lines(yes?got:a))}<details class="say"><summary>How to say it</summary><p>${esc(d.say)}</p></details></div>`;
  });

  /* lead with three */
  let lead='';
  if(raised.length<3)lead=`<p class="tip">Raise at least three findings to practice choosing what to lead with.</p>`;
  else lead=`<p>The owner gives you five minutes. Pick the three you'd lead with.</p><div id="leadList">${raised.map(f=>`<label class="pick"><input type="checkbox" value="${f.id}" ${S.lead.includes(f.id)?'checked':''}><span>${esc(f.title)} <span class="chip sev-${f.sev}" style="margin-left:4px">${f.sev}</span></span></label>`).join('')}</div><div class="btnrow"><button class="primary" id="leadBtn" ${S.lead.length===3?'':'disabled'}>Compare with my pick</button></div><div id="leadOut"></div>`;

  /* SB 2610 */
  const fid=raised.map(f=>f.id);
  const sb=SC.sb(fid)+(SC.refNote||'');

  /* conduct */
  const log=S.trapLog||[], trapsAvail=Object.keys(S.j).filter(id=>CONDUCT[id]);
  const authTxt=S.auth==='signed'?'You got the walkthrough authorization signed before looking at anything.':S.auth==='late'?"You got the authorization signed, but only after you'd started looking. Get it signed at the front desk first.":SC.mgr.never;
  const conduct=`<h3 class="sec">Professional conduct</h3><div class="insight">
    <p>${authTxt}</p>
    ${log.map(x=>`<p><b>${esc(x.title)}.</b> ${esc(x.why)}</p>`).join('')}
    ${trapsAvail.length&&!log.length?`<p>You looked without touching: no photos, no opening files, no trying doors or computers. That's the standard.</p>`:''}</div>`;

  /* room by room */
  let rooms='';
  ROOM_ORDER.forEach(room=>{
    const all=act.filter(f=>f.room===room);if(!all.length)return;
    rooms+=`<h4 class="dr">${ROOM_NAMES[room]}</h4>`;
    all.forEach(f=>{const s=statusOf(f.id),j=S.j[f.id];
      rooms+=`<details class="di"><summary><span class="t">${esc(f.title)}</span><span class="chip sev-${f.sev}">${f.sev}</span><span class="chip c-${f.cat}">${CATN[f.cat]}</span><span class="st ${s}">${STATUS_TXT[s]}</span></summary><div class="body">
        ${j&&j.raise?`<p class="muted">Your call: ${j.sev}, ${CATN[j.cat]}.</p>`:''}
        <p>${esc(fill(f.see))}</p><p><b>Say:</b> ${esc(fill(f.say))}</p><p><b>Assessment would recommend:</b> ${esc(f.fix)}</p><p><b>Ask:</b> ${esc(f.ask)}</p><p class="muted" style="font-size:14px">${esc(f.ref)}</p></div></details>`});
  });
  if(fps.length)rooms+=`<h4 class="dr">False positives</h4>`+fps.map(id=>`<details class="di"><summary><span class="t">${esc(DECOYS[id]?DECOYS[id].title:FIND[id].label)}</span></summary><div class="body"><p>${esc(DECOYS[id]?DECOYS[id].note:fill(FIND[id].ok))}</p></div></details>`).join('');

  openSheet(`<h2>${esc(heading||'Debrief')}</h2>
  <p class="muted">${act.length} findings were switched on this run${S.hints?`. ${S.hints} hint${S.hints>1?'s':''} used`:''}${used!=null?`. Time used: ${fmt(used)}`:''}.</p>
  <div class="stats">
    <div><b>${st.found}</b><span>Found</span></div><div><b>${st.hint}</b><span>With a hint</span></div><div><b>${st.revealed}</b><span>Revealed</span></div><div><b>${st.after}</b><span>After time</span></div>
    <div><b>${st.changed}</b><span>Second look</span></div><div><b>${st.dismissed}</b><span>Passed on</span></div><div><b>${st.missed}</b><span>Missed</span></div><div><b>${fps.length}</b><span>False positives</span></div>
  </div>
  <p class="tip">Only "Found" counts toward your score, and your calls are scored on those items only. Severity matched ${fnd.length?`${sevM} of ${fnd.length}`:'n/a'}; give it or save it matched ${fnd.length?`${catM} of ${fnd.length}`:'n/a'}.</p>
  ${pattern}
  <h3 class="sec">Lead with three</h3>${lead}
  ${sb}
  ${conduct}
  <h3 class="sec">Room by room</h3>${rooms}
  <h3 class="sec">Your notes</h3>
  <textarea id="notes" placeholder="What would you lead with if the owner only gave you five minutes?">${esc(S.notes)}</textarea>
  <div class="btns" id="dbBtns"><button class="primary" id="keep">Keep walking</button><button id="reset">Start a new run</button></div>`);
  const ta=document.getElementById('notes');ta.oninput=()=>{S.notes=ta.value;save()};
  document.getElementById('keep').onclick=closeSheet;
  document.getElementById('reset').onclick=()=>{
    const bb=document.getElementById('dbBtns');
    bb.innerHTML=`<p style="width:100%;margin:0">Start a new run? This clears this run's calls, notes, and timer.</p><button class="primary" id="resetYes">Yes, start a new run</button><button id="resetNo">Cancel</button>`;
    document.getElementById('resetNo').onclick=()=>openDebrief(heading);
    document.getElementById('resetYes').onclick=()=>{const t=S.timed,rl=S.realistic,sd=S.sound;stopTimer();S=freshState(S.run.scenario);S.timed=t;S.realistic=rl;S.sound=sd;S.started=false;save();closeSheet();renderScene('plan');cam=camFor();applyCam();showIntroCard();drawTimer();openIntro()};
  };
  const ll=document.getElementById('leadList');
  if(ll){
    const lb=document.getElementById('leadBtn');
    ll.querySelectorAll('input').forEach(i=>i.onchange=()=>{const ch=[...ll.querySelectorAll('input:checked')].map(x=>x.value);if(ch.length>3){i.checked=false;return}S.lead=ch;S.leadDone=false;save();lb.disabled=ch.length!==3;document.getElementById('leadOut').innerHTML=''});
    const show=()=>{const rec=recommended(),overlap=S.lead.filter(id=>rec.some(f=>f.id===id)).length;
      document.getElementById('leadOut').innerHTML=`<div class="cmp"><div><b>Your three</b><ol>${S.lead.map(id=>`<li>${esc(FIND[id].title)}</li>`).join('')}</ol></div><div><b>My three</b><ol>${rec.map(f=>`<li>${esc(f.title)}${statusOf(f.id)==='missed'||statusOf(f.id)==='dismissed'?' <span class="muted">(you didn\'t raise this)</span>':''}</li>`).join('')}</ol></div></div><p class="tip" style="margin-top:10px">${overlap} of 3 match. Lead with what is high severity and cheap to fix: the owner can act today, and you've shown value before you mention the assessment.${rec.some(f=>f.hook)?' Whatever else you lead with, bring up the PCI non-compliance fee. They are already paying for not being compliant, and the assessment is how that fee goes away.':''}</p>`;
      S.leadDone=true;save()};
    lb.onclick=show;if(S.leadDone&&S.lead.length===3)show();
  }
}
document.getElementById('debriefBtn').onclick=()=>{if(!S.started){openIntro();return}openDebrief()};
let toastT;function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}

/* ---------- boot ---------- */
const resumed=load();
renderScene('plan');cam=camFor();applyCam();showIntroCard();drawTimer();drawSound();
if(!resumed||!S.started)openIntro();
else if(S.timed&&!S.ended&&S.remaining>0)toast(`Welcome back. ${fmt(S.remaining)} left. Tap the clock to resume.${S.sound?' Sound starts when you tap.':''}`);

</script>
</body>
